name: safe_signal
description: Emergency SOS communication app for people with chronic conditions.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.2.0
  firebase_storage: ^12.1.0
  firebase_messaging: ^15.0.0
  firebase_app_check: ^0.3.0+4
  firebase_crashlytics: ^4.0.0
  firebase_remote_config: ^5.0.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Networking
  dio: ^5.5.0+1
  connectivity_plus: ^6.0.3

  # Camera & Media
  camera: ^0.11.0+2
  video_player: ^2.9.1

  # Location
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Sensors
  sensors_plus: ^5.0.1

  # Background Service
  flutter_background_service: ^5.0.7

  # UI & Design
  google_fonts: ^6.2.1

  # Utilities
  uuid: ^4.4.2
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  permission_handler: ^11.3.1
  home_widget: ^0.6.0

  # PDF generation
  pdf: ^3.11.0
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
